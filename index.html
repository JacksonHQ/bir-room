<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>生日小屋 · A Little Room For You</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene"></canvas>
<!-- 锁定鼠标后的屏幕中心准星 -->
<div id="crosshair" class="hidden"></div>

<!-- 顶部导航栏 -->
<header id="topbar">
  <div class="tb-left">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </div>
    <div class="tb-title">
      <div class="tb-name">生日小屋</div>
      <div class="tb-sub">A LITTLE ROOM FOR YOU</div>
    </div>
  </div>
  <div class="tb-center" id="tbNav">
    <span class="phase"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>午后</span>
    <span class="dot">·</span><a class="nav-it" data-room="living">客厅</a><span class="sep">/</span><a class="nav-it" data-room="read">阅读角</a><span class="sep">/</span><a class="nav-it" data-room="plant">绿植角</a>
  </div>
  <div class="tb-right">
    <button class="pill" id="btnMusic">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span id="musicText">音乐已开启</span>
    </button>
    <button class="round-btn" id="btnHelp">?</button>
  </div>
</header>

<!-- 左上：进度提示 -->
<div id="progressCard" class="card-min">
  <div class="pc-t">生日寻宝进行中</div>
  <div class="pc-s">已解开 <b id="unlockNum">0</b> / 5 个小机关</div>
</div>

<!-- 右上：唱片播放提示 -->
<div id="playingPill" class="pill-toast hidden">
  <svg viewBox="0 0 24 24" class="ic"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  <span>唱片正在播放：祝你生日快乐</span>
</div>

<!-- 左下：情境提示 -->
<div id="hintToast" class="pill-toast hidden"><span id="hintToastText"></span></div>

<!-- 中下：动作提示（临时） -->
<div id="centerToast" class="pill-toast center hidden">
  <svg viewBox="0 0 24 24" class="ic"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M18.5 14.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <span id="centerToastText"></span>
</div>

<!-- 底部操作条 -->
<footer id="bottombar">
  <div class="bb-left">
    <span class="key">W A S D</span><span class="lb">行走</span>
    <span class="key ic-k"><svg viewBox="0 0 24 24" class="ic"><rect x="7" y="3" width="10" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 6v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="lb">点击画面后移动鼠标转头</span>
    <span class="key">E</span><span class="lb">互动</span>
    <span class="key">Esc</span><span class="lb">释放鼠标</span>
  </div>
  <div class="bb-right">
    <button class="bb-it" id="btnHint">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>一点提示
    </button>
    <button class="bb-it" id="btnNotes">
      <svg viewBox="0 0 24 24" class="ic"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5v-15z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>手记
    </button>
    <span class="bb-it counter">
      <svg viewBox="0 0 24 24" class="ic"><rect x="4" y="9" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 12h16M12 9v11M12 9c-2.8 0-4.5-1.2-4.5-2.8C7.5 4.7 8.7 4 9.8 4c1.5 0 2.2 1.6 2.2 5zm0 0c2.8 0 4.5-1.2 4.5-2.8C16.5 4.7 15.3 4 14.2 4 12.7 4 12 5.6 12 9z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      口袋里的心意 <b id="heartNum">0</b><i>/</i>5
    </span>
    <button class="bb-it" id="btnReset" title="重新开始">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3M4.5 12V7m0 5H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="bb-it">
      <svg viewBox="0 0 24 24" class="ic"><rect x="7" y="3" width="10" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 6v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>滚轮缩放
    </span>
  </div>
</footer>

<!-- 居中开场白 -->
<div id="openingCaption" class="opening-cap hidden">
  <div class="oc-t">最后一份惊喜，正在打开</div>
  <div class="oc-s">把灯光留给烛火，把今天留给你。</div>
</div>

<!-- 右侧夜晚面板（开盒后注入） -->
<div id="nightPanel" class="hidden"></div>

<!-- 弹窗 -->
<div id="modalMask" class="hidden">
  <div id="modalCard" class="modal">
    <button class="m-close" id="modalClose">✕</button>
    <div class="m-label" id="mLabel"></div>
    <div class="m-icon" id="mIcon"></div>
    <div class="m-title" id="mTitle"></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-extra" id="mExtra"></div>
    <button class="m-btn hidden" id="mBtn"><span id="mBtnText"></span><span class="m-btn-ic" id="mBtnIc"></span></button>
  </div>
</div>

<!-- 开场遮罩 -->
<div id="introMask">
  <div id="introCard" class="modal intro">
    <div class="m-label"><svg viewBox="0 0 24 24" class="ic"><path d="M9 21v-3H6l-1-1v-3H3l7-7h2l2 2h3v3l2 2v3h-3v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>第一人称 · 自由探索</div>
    <div class="intro-title">门开着，<br>就等你了。</div>
    <div class="intro-body">房间大了一点，秘密也多了一点。<br>沿着线索，解开朋友们的小机关。</div>
    <button class="m-btn wide" id="btnEnter"><span>走进小屋</span><span class="m-btn-ic">→</span></button>
    <div class="intro-foot">WASD 行走 · 移动鼠标转头 · Esc 释放鼠标<br>手机：点击屏幕行走 · 双指缩放</div>
  </div>
</div>

<script src="js/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script src="js/music.js"></script>
<script src="js/game.js"></script>
</body>
</html>
